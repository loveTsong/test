<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人作品展示</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 导航栏 -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="#hero" class="nav-logo" id="navLogo">Portfolio</a>
      <ul class="nav-links" id="navLinks"></ul>
      <button class="nav-toggle" id="navToggle" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- 首屏 Hero -->
  <section class="hero" id="hero">
    <div class="hero-particles"></div>
    <div class="hero-content" id="heroContent"></div>
    <div class="hero-visual">
      <div class="floating-shape shape-1"></div>
      <div class="floating-shape shape-2"></div>
      <div class="floating-shape shape-3"></div>
      <div class="hero-avatar" id="heroAvatar"></div>
    </div>
    <a href="#about" class="scroll-indicator">
      <span>向下滚动</span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
    </a>
  </section>

  <!-- 关于我 -->
  <section class="about section" id="about">
    <div class="container" id="aboutContainer"></div>
  </section>

  <!-- 工作经历 -->
  <section class="experience section" id="experience">
    <div class="container" id="experienceContainer"></div>
  </section>

  <!-- 作品集 -->
  <section class="projects section" id="projects">
    <div class="container" id="projectsContainer"></div>
  </section>

  <!-- 项目清单 -->
  <section class="project-list section" id="project-list">
    <div class="container" id="projectListContainer"></div>
  </section>

  <!-- 技能 -->
  <section class="skills section" id="skills">
    <div class="container" id="skillsContainer"></div>
  </section>

  <!-- 联系 -->
  <section class="contact section" id="contact">
    <div class="container" id="contactContainer"></div>
  </section>

  <!-- 页脚 -->
  <footer class="footer" id="footer"></footer>

  <!-- 作品详情弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
